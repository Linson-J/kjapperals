<script>
(function() {
    // Search Modal Controller
    const RECENT_SEARCHES_KEY = 'kjapperals_recent_searches_history';
    const MAX_RECENT_SEARCHES = 8;

    const overlay = document.getElementById('searchModalOverlay');
    const container = document.querySelector('.search-modal-container');
    const searchInput = document.getElementById('customerSearchInput');
    const clearBtn = document.getElementById('searchClearBtn');
    const closeBtn = document.getElementById('closeSearchModalBtn');
    const loadingState = document.getElementById('searchLoadingState');
    const defaultSection = document.getElementById('searchDefaultSection');
    const resultsContainer = document.getElementById('searchResultsContainer');
    const categoriesBlock = document.getElementById('searchCategoriesBlock');
    const categoryChips = document.getElementById('searchCategoryChips');
    const productsBlock = document.getElementById('searchProductsBlock');
    const productsGrid = document.getElementById('searchProductsGrid');
    const viewAllWrapper = document.getElementById('searchViewAllWrapper');
    const viewAllLink = document.getElementById('searchViewAllLink');
    const viewAllCount = document.getElementById('searchViewAllCount');
    const viewAllQuery = document.getElementById('searchViewAllQuery');
    const noResults = document.getElementById('searchNoResults');
    const noResultsQuery = document.getElementById('noResultsQuery');
    const historyBlock = document.getElementById('searchHistoryBlock');
    const historyList = document.getElementById('searchHistoryList');
    const clearHistoryBtn = document.getElementById('searchClearHistoryBtn');

    let debounceTimer = null;

    // Helper: LocalStorage Recent Searches
    function getRecentSearches() {
        try {
            const raw = localStorage.getItem(RECENT_SEARCHES_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveRecentSearch(query) {
        if (!query || !query.trim()) return;
        const trimmed = query.trim();
        let history = getRecentSearches();
        // Remove existing case-insensitive duplicate
        history = history.filter(item => item.toLowerCase() !== trimmed.toLowerCase());
        // Unshift newest to front
        history.unshift(trimmed);
        if (history.length > MAX_RECENT_SEARCHES) {
            history = history.slice(0, MAX_RECENT_SEARCHES);
        }
        try {
            localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(history));
        } catch (e) {}
        renderRecentSearches();
    }

    function removeRecentSearch(query) {
        let history = getRecentSearches();
        history = history.filter(item => item !== query);
        try {
            localStorage.setItem(RECENT_SEARCHES_KEY, JSON.stringify(history));
        } catch (e) {}
        renderRecentSearches();
    }

    function clearAllRecentSearches() {
        try {
            localStorage.removeItem(RECENT_SEARCHES_KEY);
        } catch (e) {}
        renderRecentSearches();
    }

    function renderRecentSearches(filterTerm = '') {
        const history = getRecentSearches();
        let filtered = history;
        if (filterTerm && filterTerm.trim()) {
            const term = filterTerm.trim().toLowerCase();
            filtered = history.filter(item => item.toLowerCase().includes(term));
        }

        if (!filtered || filtered.length === 0) {
            historyBlock.style.display = 'none';
            return;
        }

        historyBlock.style.display = 'flex';
        historyList.innerHTML = filtered.map(item => `
            <div class="search-history-item" data-history-query="${escapeHtml(item)}">
                <div class="search-history-left">
                    <i class="ri-history-line"></i>
                    <span>${escapeHtml(item)}</span>
                </div>
                <button type="button" class="search-history-remove-btn" title="Remove search term" data-remove-query="${escapeHtml(item)}">
                    <i class="ri-close-line"></i>
                </button>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
    }

    function formatMoney(amount) {
        return '$' + Number(amount || 0).toFixed(2);
    }

    // Modal Control Functions
    function openSearchModal(initialQuery = '') {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        renderRecentSearches();

        if (initialQuery) {
            searchInput.value = initialQuery;
            clearBtn.style.display = 'flex';
            performSearch(initialQuery);
        } else {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            resetSearchView();
        }

        setTimeout(() => searchInput.focus(), 150);
    }

    function closeSearchModal() {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
    }

    function resetSearchView() {
        loadingState.style.display = 'none';
        searchResultsContainer.style.display = 'none';
        noResults.style.display = 'none';
        defaultSection.style.display = 'block';
        renderRecentSearches();
    }

    // Perform Live AJAX Search
    async function performSearch(query) {
        const trimmed = query.trim();
        if (!trimmed) {
            resetSearchView();
            return;
        }

        loadingState.style.display = 'flex';
        defaultSection.style.display = 'none';
        searchResultsContainer.style.display = 'none';
        noResults.style.display = 'none';

        // Filter and show matching recent searches below live results
        renderRecentSearches(trimmed);

        try {
            const response = await fetch(`/api/search/?q=${encodeURIComponent(trimmed)}`, {
                headers: { 'Accept': 'application/json' }
            });
            const data = await response.json();
            loadingState.style.display = 'none';

            if (!data.success || !data.data) {
                showNoResults(trimmed);
                return;
            }

            const { products, categories, total_count } = data.data;

            if ((!products || products.length === 0) && (!categories || categories.length === 0)) {
                showNoResults(trimmed);
                return;
            }

            // Display Results
            searchResultsContainer.style.display = 'flex';
            searchResultsContainer.style.flexDirection = 'column';
            searchResultsContainer.style.gap = '18px';

            // 1. Categories
            if (categories && categories.length > 0) {
                categoriesBlock.style.display = 'flex';
                categoryChips.innerHTML = categories.map(cat => `
                    <a href="/shop/?category=${encodeURIComponent(cat.slug)}" class="search-category-chip-item" onclick="window.saveRecentSearch('${escapeHtml(trimmed)}')">
                        <i class="ri-price-tag-3-line"></i> ${escapeHtml(cat.name)}
                    </a>
                `).join('');
            } else {
                categoriesBlock.style.display = 'none';
            }

            // 2. Products
            if (products && products.length > 0) {
                productsBlock.style.display = 'flex';
                productsGrid.innerHTML = products.map(prod => {
                    const priceHtml = prod.discount_price 
                        ? `<span class="search-product-price">${formatMoney(prod.discount_price)}</span> <span class="search-product-original-price">${formatMoney(prod.price)}</span>`
                        : `<span class="search-product-price">${formatMoney(prod.price)}</span>`;
                    
                    const imgHtml = prod.image_url
                        ? `<img src="${prod.image_url}" alt="${escapeHtml(prod.name)}" class="search-product-img">`
                        : `<div class="search-product-img-placeholder"><i class="ri-image-line"></i></div>`;

                    return `
                        <a href="/products/${encodeURIComponent(prod.slug)}/" class="search-product-card" onclick="window.saveRecentSearch('${escapeHtml(trimmed)}')">
                            ${imgHtml}
                            <div class="search-product-info">
                                <span class="search-product-title">${escapeHtml(prod.name)}</span>
                                <span class="search-product-category">${escapeHtml(prod.category_name)}</span>
                            </div>
                            <div class="search-product-pricing">
                                ${priceHtml}
                            </div>
                        </a>
                    `;
                }).join('');
            } else {
                productsBlock.style.display = 'none';
            }

            // 3. View All Button
            viewAllWrapper.style.display = 'block';
            viewAllCount.textContent = total_count || products.length;
            viewAllQuery.textContent = trimmed;
            viewAllLink.href = `/shop/?search=${encodeURIComponent(trimmed)}`;

        } catch (error) {
            loadingState.style.display = 'none';
            showNoResults(trimmed);
        }
    }

    function showNoResults(query) {
        searchResultsContainer.style.display = 'none';
        noResults.style.display = 'block';
        noResultsQuery.textContent = query;
        renderRecentSearches(query);
    }

    // Expose global helper for clicks on search links
    window.saveRecentSearch = saveRecentSearch;

    // Event Listeners
    // Open triggers
    document.addEventListener('click', function(e) {
        const trigger = e.target.closest('[data-search-trigger]');
        if (trigger) {
            e.preventDefault();
            openSearchModal();
        }
    });

    // Close triggers
    if (closeBtn) closeBtn.addEventListener('click', closeSearchModal);
    
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
            closeSearchModal();
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.classList.contains('active')) {
            closeSearchModal();
        }
    });

    // Search Input Typing (Debounced)
    searchInput.addEventListener('input', function() {
        const query = searchInput.value;
        if (query.trim().length > 0) {
            clearBtn.style.display = 'flex';
        } else {
            clearBtn.style.display = 'none';
        }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            performSearch(query);
        }, 200);
    });

    // Submit on Enter
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (query) {
                saveRecentSearch(query);
                closeSearchModal();
                window.location.href = `/shop/?search=${encodeURIComponent(query)}`;
            }
        }
    });

    // View All Link Click
    if (viewAllLink) {
        viewAllLink.addEventListener('click', function(e) {
            const query = searchInput.value.trim();
            if (query) {
                saveRecentSearch(query);
            }
        });
    }

    // Clear Search Input Button
    if (clearBtn) {
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            searchInput.focus();
            resetSearchView();
        });
    }

    // Popular Tag Chips Click
    document.addEventListener('click', function(e) {
        const chip = e.target.closest('[data-suggested-query]');
        if (chip) {
            const query = chip.dataset.suggestedQuery;
            searchInput.value = query;
            clearBtn.style.display = 'flex';
            searchInput.focus();
            performSearch(query);
        }
    });

    // History Item Click & Delete
    historyList.addEventListener('click', function(e) {
        // Delete button
        const removeBtn = e.target.closest('[data-remove-query]');
        if (removeBtn) {
            e.stopPropagation();
            const queryToRemove = removeBtn.dataset.removeQuery;
            removeRecentSearch(queryToRemove);
            return;
        }

        // History row item
        const historyRow = e.target.closest('[data-history-query]');
        if (historyRow) {
            const query = historyRow.dataset.historyQuery;
            searchInput.value = query;
            clearBtn.style.display = 'flex';
            searchInput.focus();
            performSearch(query);
        }
    });

    // Clear All History Button
    if (clearHistoryBtn) {
        clearHistoryBtn.addEventListener('click', function() {
            clearAllRecentSearches();
        });
    }

})();
</script>
